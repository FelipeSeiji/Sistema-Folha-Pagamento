spring.application.name=payroll-service
server.port=8081

personnel.base-url=${PERSONNEL_BASE_URL:http://127.0.0.1:8080}
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s
spring.jpa.hibernate.ddl-auto=validate
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.acks=all
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.consumer.group-id=payroll-closed-summary
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/payroll
spring.security.oauth2.resourceserver.jwt.audiences=payroll-service

payroll.attendance.company-backfill.enabled=${PAYROLL_ATTENDANCE_COMPANY_BACKFILL_ENABLED:false}

spring.security.oauth2.client.registration.personnel.provider=personnel-keycloak
spring.security.oauth2.client.registration.personnel.client-id=${PAYROLL_PERSONNEL_CLIENT_ID:payroll-personnel-service}
spring.security.oauth2.client.registration.personnel.client-secret=${PAYROLL_PERSONNEL_CLIENT_SECRET:}
spring.security.oauth2.client.registration.personnel.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.personnel.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.personnel.scope=personnel.payroll.read
spring.security.oauth2.client.provider.personnel-keycloak.token-uri=${PAYROLL_PERSONNEL_TOKEN_URI:http://localhost:8180/realms/payroll/protocol/openid-connect/token}
