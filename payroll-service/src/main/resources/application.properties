spring.application.name=payroll-service
server.port=8081

personnel.base-url=${PERSONNEL_BASE_URL:http://127.0.0.1:8080}
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s
spring.jpa.hibernate.ddl-auto=validate
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.acks=all
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.consumer.group-id=payroll-closed-summary
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
